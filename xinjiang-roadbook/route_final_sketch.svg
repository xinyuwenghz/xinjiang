  <text x="500.0" y="82" text-anchor="middle" font-size="14" fill="#636E72" font-family="PingFang SC, Microsoft YaHei, sans-serif">乌鲁木齐 · 奎屯 · 赛里木湖 · 魔鬼城 · 克拉玛依 · 布尔津 · 喀纳斯 · 禾木 · 阿勒泰</text>

